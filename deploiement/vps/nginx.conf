# Le site est volontairement lourd : ni compression ni cache réglés, comme sur un vieil hébergement.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Site fictif de formation : jamais dans les moteurs de recherche
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
